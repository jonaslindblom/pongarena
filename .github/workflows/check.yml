name: Check and rank

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate every bundled model before tests and ranking
        run: npm run models:check
      - run: npm test
      - name: Reproduce the published league
        if: ${{ !cancelled() }}
        run: npm run league:check -- --output "$RUNNER_TEMP/league"
      - name: Show development standings
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/league/league.md"; then
            cat "$RUNNER_TEMP/league/league.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload regenerated results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: development-league-results
          path: ${{ runner.temp }}/league/
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run build
        if: ${{ !cancelled() }}

  browser:
    name: Browser end-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install the matching Chromium browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload browser report and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  training:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: training/requirements.txt
      - name: Install CPU training dependencies
        run: |
          python -m pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r training/requirements.txt
      - name: Exercise training and ONNX export
        run: |
          python -m unittest discover -s training -p 'test_*.py'
          python training/train.py --size small --smoke --out "$RUNNER_TEMP/training-smoke"
          python training/check.py --models public/models --run "$RUNNER_TEMP/training-smoke"
          python training/train.py --size large --smoke --out "$RUNNER_TEMP/training-large-smoke"
          python training/check.py --run "$RUNNER_TEMP/training-large-smoke"
      - name: Reproduce handwritten weights independently
        run: |
          python -m unittest discover -s experiments/quill -p 'test_*.py'
          for constructor in handwritten/*.py; do
            model_id=$(basename "$constructor" .py)
            python "$constructor" --out "$RUNNER_TEMP/$model_id.onnx"
            cmp "$RUNNER_TEMP/$model_id.onnx" "public/models/$model_id.onnx"
          done
